{{define "content"}}
{{with .Data}}
<section class="login">
  <h1>Masuk</h1>
  <p class="lede">Gunakan akun yang diberikan Platform Admin.</p>
  {{if .Error}}<div class="flash flash-error" role="alert">{{.Error}}</div>{{end}}
  <form method="post" action="/login" class="stack">
    <input type="hidden" name="next" value="{{.Next}}">
    <label>Username
      <input name="username" value="{{.Username}}" autocomplete="username" autocapitalize="none" spellcheck="false" required autofocus>
    </label>
    <label>Password
      <input name="password" type="password" autocomplete="current-password" required>
    </label>
    <button class="btn" type="submit">Masuk</button>
  </form>
</section>
{{end}}
{{end}}
